<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Hub · 多AI评审控制台</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef;
          --dim:#8b93a3; --accent:#4f8cff; --ok:#3fb97c; --warn:#e0a63f; --bad:#e05f5f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header .sub { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns:320px 1fr; gap:0; height:calc(100vh - 55px); }
  #list, #plist { border-right:1px solid var(--line); overflow:auto; padding:10px; }
  #detail, #pdetail { overflow:auto; padding:20px 24px; }
  .run-item { padding:10px 12px; border:1px solid var(--line); border-radius:8px;
              margin-bottom:8px; cursor:pointer; }
  .run-item:hover { border-color:var(--accent); }
  .run-item.active { border-color:var(--accent); background:#1a2233; }
  .run-item .t { font-weight:600; }
  .run-item .m { color:var(--dim); font-size:12px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
  .b-pending { background:#3a2f14; color:var(--warn); }
  .b-resolved { background:#14301f; color:var(--ok); }
  .b-blocker { background:#3a1717; color:var(--bad); }
  .b-major { background:#3a2f14; color:var(--warn); }
  .b-minor,.b-nit { background:#1a2233; color:var(--dim); }
  h2 { font-size:16px; margin:18px 0 8px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:12px 14px; margin-bottom:10px; }
  .cluster .head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .cluster .msg { margin-top:6px; }
  .cluster .sup { color:var(--dim); font-size:12px; margin-top:4px; }
  pre { background:#0b0d11; border:1px solid var(--line); border-radius:8px;
        padding:12px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  textarea { width:100%; min-height:64px; background:#0b0d11; color:var(--fg);
             border:1px solid var(--line); border-radius:8px; padding:8px;
             font:13px/1.5 inherit; }
  .btns { display:flex; gap:10px; margin-top:10px; }
  button { padding:8px 18px; border-radius:8px; border:1px solid var(--line);
           background:#1d2330; color:var(--fg); cursor:pointer; font-size:14px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .empty { color:var(--dim); padding:30px; text-align:center; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td,th { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
           background:#1d2330; border:1px solid var(--accent); padding:8px 16px;
           border-radius:8px; display:none; }
</style>
</head>
<body>
<header>
  <h1>Agent Hub</h1>
  <span class="sub">多 AI 协作评审平台 · 人工确认后落实</span>
  <span class="sub" style="margin-left:auto" id="health"></span>
</header>
<div style="display:flex;gap:4px;padding:8px 20px 0;border-bottom:1px solid var(--line)">
  <button id="tabReview" class="primary" style="border-radius:8px 8px 0 0" onclick="switchTab('review')">代码评审</button>
  <button id="tabProposal" style="border-radius:8px 8px 0 0" onclick="switchTab('proposal')">方案共创</button>
</div>
<main id="reviewView">
  <div id="list">
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="primary" style="flex:1" onclick="newRun()">＋ 手动跑一次 Compare</button>
      <button onclick="loadRuns()">刷新</button>
    </div>
    <button style="width:100%;margin-bottom:10px" onclick="toggleDiffForm()">📋 粘贴 Diff 评审</button>
    <div id="diffForm" style="display:none;margin-bottom:10px">
      <input id="dfTitle" placeholder="标题（可选），如：退款接口幂等改造"
             style="width:100%;margin-bottom:6px;background:#0b0d11;color:var(--fg);
                    border:1px solid var(--line);border-radius:8px;padding:8px;
                    font:13px/1.5 inherit;box-sizing:border-box">
      <textarea id="dfDiff" style="min-height:140px;font-family:Consolas,monospace"
                placeholder="粘贴 git diff 内容（统一 diff 格式）"></textarea>
      <textarea id="dfCtx" style="min-height:44px;margin-top:6px"
                placeholder="补充说明（可选）：改动目的、业务背景，有助于提高评审质量"></textarea>
      <div class="btns">
        <button class="primary" id="dfBtn" style="flex:1" onclick="submitDiff()">提交评审</button>
        <button onclick="toggleDiffForm()">收起</button>
      </div>
      <div id="dfHint" style="color:var(--dim);font-size:12px;margin-top:6px;display:none">
        多家 AI 正在并行评审，通常 1–3 分钟，请稍候…</div>
    </div>
    <div id="runs"></div>
  </div>
  <div id="detail"><div class="empty">选择左侧 run 查看详情；或手动触发一次 Compare。</div></div>
</main>
<main id="proposalView" style="display:none">
  <div id="plist">
    <button class="primary" style="width:100%;margin-bottom:10px" onclick="toggleIdeaForm()">💡 发布想法 / 方案需求</button>
    <div id="ideaForm" style="display:none;margin-bottom:10px">
      <textarea id="pfIdea" style="min-height:90px"
                placeholder="描述你的想法或方案需求，例如：我想给团队做一个内部知识库搜索工具，大家有什么好方案"></textarea>
      <textarea id="pfCtx" style="min-height:44px;margin-top:6px"
                placeholder="补充背景（可选）：现状、约束、预算、期限等"></textarea>
      <div class="btns">
        <button class="primary" id="pfBtn" style="flex:1" onclick="submitProposal()">提交给四家 AI</button>
        <button onclick="toggleIdeaForm()">收起</button>
      </div>
      <div id="pfHint" style="color:var(--dim);font-size:12px;margin-top:6px;display:none">
        四家 AI 正在并行出方案并交叉评审，通常 2–5 分钟，请稍候…</div>
    </div>
    <div id="proposals"></div>
  </div>
  <div id="pdetail"><div class="empty">发布一个想法，四家 AI（Kimi / MiniMax / DeepSeek / 千问）将分别出方案、互相评审，由你做最终决定。</div></div>
</main>
<div id="toast"></div>
<script>
let current = null;

function toast(msg){ const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', 2500); }

async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok){ let e; try{ e=(await r.json()).detail; }catch(_){ e=r.statusText; }
    throw new Error(e||('HTTP '+r.status)); }
  return r.json();
}

async function loadHealth(){
  try{ const h=await api('/health');
    document.getElementById('health').textContent =
      `模式 ${h.mode} · 外发 ${h.dry_run_post?'DRY-RUN':'REAL'}`;
  }catch(e){ document.getElementById('health').textContent='服务不可达'; }
}

async function loadRuns(){
  const {runs} = await api('/runs');
  const box = document.getElementById('runs');
  box.innerHTML = runs.length ? '' : '<div class="empty">还没有 run</div>';
  runs.forEach(r=>{
    const d=document.createElement('div');
    d.className='run-item'+(current===r.run_id?' active':'');
    d.innerHTML=`<div class="t">${r.title||r.run_id}</div>
      <div class="m">${r.repo} #${r.mr_id} · ${r.provider}</div>
      <div class="m">${r.created_at}
        <span class="badge ${r.status==='pending_human'?'b-pending':'b-resolved'}">
          ${r.status==='pending_human'?'待人工确认':'已处理'}</span></div>`;
    d.onclick=()=>showRun(r.run_id);
    box.appendChild(d);
  });
}

async function newRun(){
  try{ const r=await api('/compare/run',{method:'POST',
    headers:{'Content-Type':'application/json'},body:'{}'});
    toast('已创建 run: '+r.run_id);
    current=r.run_id; loadRuns(); showRun(r.run_id);
  }catch(e){ toast('失败: '+e.message); }
}

function toggleDiffForm(){
  const f=document.getElementById('diffForm');
  f.style.display = f.style.display==='none' ? 'block' : 'none';
}

async function submitDiff(){
  const diff=document.getElementById('dfDiff').value.trim();
  if(!diff){ toast('请先粘贴 diff 内容'); return; }
  const btn=document.getElementById('dfBtn');
  btn.disabled=true; btn.textContent='评审中…';
  document.getElementById('dfHint').style.display='block';
  try{
    const r=await api('/compare/run',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        title: document.getElementById('dfTitle').value,
        diff, context: document.getElementById('dfCtx').value})});
    toast('评审完成: '+r.run_id);
    current=r.run_id; loadRuns(); showRun(r.run_id);
    document.getElementById('dfDiff').value='';
    document.getElementById('dfCtx').value='';
    document.getElementById('dfTitle').value='';
  }catch(e){ toast('失败: '+e.message); }
  btn.disabled=false; btn.textContent='提交评审';
  document.getElementById('dfHint').style.display='none';
}

async function showRun(id){
  current=id;
  const s=await api('/runs/'+id);
  const v=s.verdict||{};
  const el=document.getElementById('detail');
  let html=`<h2>${s.event?.title||s.run_id}
    <span class="badge ${s.pending_human?'b-pending':'b-resolved'}">
      ${s.pending_human?'待人工确认':'已处理'}</span></h2>
    <div class="m" style="color:var(--dim)">${s.run_id} · ${s.event?.repo} #${s.event?.mr_id}
      · ${s.created_at}${s.event?.url?` · <a href="${s.event.url}" target="_blank" style="color:var(--accent)">打开 MR</a>`:''}</div>

    <h2>裁决结论</h2>
    <div class="card"><b>${v.recommendation||'-'}</b> — ${v.reason||''}</div>`;

  if(s.agent_errors && Object.keys(s.agent_errors).length){
    html+=`<h2>Agent 异常</h2><div class="card" style="color:var(--bad)"><ul>`+
      Object.entries(s.agent_errors).map(([k,e])=>`<li>${k}: ${e}</li>`).join('')+
      `</ul></div>`;
  }

  html+=`<h2>聚类结果（${(s.clusters||[]).length}）</h2>`;
  (s.clusters||[]).forEach(c=>{
    html+=`<div class="card cluster">
      <div class="head">
        <span class="badge b-${c.severity}">${c.severity}</span>
        <b>${c.theme}</b>
        <span class="badge ${c.action==='必须修改'?'b-blocker':(c.action==='需人工确认'?'b-pending':'b-resolved')}">${c.action}</span>
        <span style="color:var(--dim)">置信度 ${c.confidence}${c.needs_human?' · 需人工':''}</span>
      </div>
      <div class="msg">${c.merged_message}</div>
      <div class="sup">支持: ${c.support.join(', ')}</div></div>`;
  });

  if((s.missing_context||[]).length){
    html+=`<h2>缺失上下文</h2><div class="card"><ul>`+
      s.missing_context.map(m=>`<li>${m}</li>`).join('')+`</ul></div>`;
  }

  html+=`<h2>MR 评论草稿</h2><pre>${(s.mr_comment_draft||'').replace(/</g,'&lt;')}</pre>`;

  if(s.pending_human){
    html+=`<h2>人工确认（确认后才允许外发）</h2>
      <textarea id="cmt" placeholder="补充评论，例如：请补唯一约束和并发单测后再合并"></textarea>
      <div class="btns">
        <button class="primary" onclick="decide('approve')">Approve</button>
        <button onclick="decide('comment')">Comment</button>
        <button onclick="decide('request_changes')">Request changes</button>
      </div>`;
  }else{
    html+=`<h2>人工决定</h2><div class="card">
      ${s.human_decision?.actor||''} 选择了 <b>${s.human_decision?.action||''}</b>
      ${s.human_decision?.comment?`：${s.human_decision.comment}`:''}
      <div style="color:var(--dim)">外发状态：${s.post_status||'-'}</div></div>`;
  }

  if((s.audit||[]).length){
    html+=`<h2>审计记录</h2><div class="card"><table><tr><th>时间</th><th>操作人</th>
      <th>动作</th><th>评论</th><th>外发状态</th></tr>`+
      s.audit.map(a=>`<tr><td>${a.created_at}</td><td>${a.actor}</td>
        <td>${a.action}</td><td>${a.comment||''}</td><td>${a.post_status||''}</td></tr>`).join('')+
      `</table></div>`;
  }

  el.innerHTML=html;
  document.querySelectorAll('.run-item').forEach(d=>d.classList.remove('active'));
}

async function decide(action){
  if(!current) return;
  const cmt=document.getElementById('cmt')?.value||'';
  try{
    const r=await api(`/runs/${current}/human-decision`,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action,comment:cmt,actor:'web-console'})});
    toast(`已记录: ${r.action}（${r.post_status}）`);
    loadRuns(); showRun(current);
  }catch(e){ toast('失败: '+e.message); }
}

loadHealth(); loadRuns();
setInterval(loadRuns, 10000);

// ---------------------------------------------------------------- 方案共创
let pcurrent = null;

function switchTab(tab){
  document.getElementById('reviewView').style.display = tab==='review'?'grid':'none';
  document.getElementById('proposalView').style.display = tab==='proposal'?'grid':'none';
  document.getElementById('tabReview').className = tab==='review'?'primary':'';
  document.getElementById('tabProposal').className = tab==='proposal'?'primary':'';
  if(tab==='proposal') loadProposals();
}

function toggleIdeaForm(){
  const f=document.getElementById('ideaForm');
  f.style.display = f.style.display==='none' ? 'block' : 'none';
}

async function submitProposal(){
  const idea=document.getElementById('pfIdea').value.trim();
  if(!idea){ toast('请先描述你的想法/需求'); return; }
  const btn=document.getElementById('pfBtn');
  btn.disabled=true; btn.textContent='出方案+评审中…';
  document.getElementById('pfHint').style.display='block';
  try{
    const r=await api('/proposal/run',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({idea, context:document.getElementById('pfCtx').value})});
    toast('完成: '+r.proposal_id);
    pcurrent=r.proposal_id; loadProposals(); showProposal(r.proposal_id);
    document.getElementById('pfIdea').value='';
    document.getElementById('pfCtx').value='';
  }catch(e){ toast('失败: '+e.message); }
  btn.disabled=false; btn.textContent='提交给四家 AI';
  document.getElementById('pfHint').style.display='none';
}

async function loadProposals(){
  const {proposals} = await api('/proposals');
  const box = document.getElementById('proposals');
  box.innerHTML = proposals.length ? '' : '<div class="empty">还没有方案共创</div>';
  proposals.forEach(r=>{
    const d=document.createElement('div');
    d.className='run-item'+(pcurrent===r.run_id?' active':'');
    d.innerHTML=`<div class="t">${r.title||r.run_id}</div>
      <div class="m">${r.created_at}
        <span class="badge ${r.status==='awaiting_decision'?'b-pending':'b-resolved'}">
          ${r.status==='awaiting_decision'?'待拍板':(r.status==='final'?'已定稿':'已处理')}</span></div>`;
    d.onclick=()=>showProposal(r.run_id);
    box.appendChild(d);
  });
}

const P_LABEL={kimi:'Kimi',minimax:'MiniMax',deepseek:'DeepSeek',qwen:'千问'};

function pCard(key, text, extra){
  return `<div class="card"><div class="head" style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
    <b>${P_LABEL[key]||key}</b>${extra||''}</div>
    <div style="white-space:pre-wrap">${(text||'').replace(/</g,'&lt;')}</div></div>`;
}

async function showProposal(id){
  pcurrent=id;
  const s=await api('/proposal/'+id);
  const el=document.getElementById('pdetail');
  const phase=s.phase;
  let html=`<h2>${(s.idea||'').slice(0,60)}
    <span class="badge ${phase==='awaiting_decision'?'b-pending':'b-resolved'}">
      ${phase==='awaiting_decision'?'待你拍板（第'+s.round+'轮）':(phase==='final'?'已定稿':'已处理')}</span></h2>
    <div class="m" style="color:var(--dim)">${s.run_id} · ${s.created_at} · 本轮耗时 ${s.elapsed_s||'-'}s</div>
    <div class="card"><b>原始需求</b><div style="white-space:pre-wrap;margin-top:4px">${(s.idea||'').replace(/</g,'&lt;')}</div></div>`;

  if(s.decision && s.phase==='final'){
    html+=`<h2>你的决定</h2><div class="card">选定 <b>${P_LABEL[s.decision.selected]||s.decision.selected}</b> 的方案
      ${s.decision.comment?`，补充意见：${s.decision.comment}`:''}
      <div style="color:var(--dim)">${s.decision.decided_at} · 由 ${P_LABEL[s.decision.selected]} 编写定稿</div></div>
      <h2>最终定稿</h2>${pCard(s.decision.selected, s.decision.final_plan)}`;
  }

  html+=`<h2>各家方案（${Object.keys(s.plans||{}).length}）</h2>`;
  for(const [k,text] of Object.entries(s.plans||{}))
    html+=pCard(k, text);

  html+=`<h2>交叉评审（每家评另外两家）</h2>`;
  for(const [k,text] of Object.entries(s.reviews||{}))
    html+=pCard(k, text, '<span class="badge b-minor">评审者</span>');

  if(s.model_errors && Object.keys(s.model_errors).length){
    html+=`<h2>模型异常</h2><div class="card" style="color:var(--bad)"><ul>`+
      Object.entries(s.model_errors).map(([k,e])=>`<li>${P_LABEL[k]||k}: ${e}</li>`).join('')+
      `</ul></div>`;
  }

  if(phase==='awaiting_decision'){
    html+=`<h2>拍板（你来做最终决定）</h2><div class="card">
      ${Object.keys(s.plans||{}).map(k=>
        `<label style="display:block;margin:4px 0"><input type="radio" name="pick" value="${k}">
         选定 ${P_LABEL[k]} 的方案，由它编写定稿</label>`).join('')}
      <textarea id="pdecComment" style="margin-top:6px" placeholder="补充意见（可选）：想调整的方向、必须保留的点、预算约束等，会交给产出 AI 写进定稿"></textarea>
      <div class="btns"><button class="primary" onclick="decideProposal()">拍板定稿</button></div></div>`;
  }

  if(phase==='final'){
    html+=`<h2>迭代优化（四家基于定稿各自出新版）</h2><div class="card">
      <textarea id="piterInstruction" placeholder="本轮迭代要求（可选）：例如 重点压缩成本 / 补充数据安全设计 / 给出两种变体"></textarea>
      <div class="btns"><button class="primary" onclick="iterateProposal()">发起新一轮迭代</button></div>
      <div id="piterHint" style="color:var(--dim);font-size:12px;margin-top:6px;display:none">
        四家 AI 正在优化，通常 2–5 分钟，请稍候…</div></div>`;
  }

  if((s.iterations||[]).length){
    html+=`<h2>迭代历史（${s.iterations.length} 轮）</h2>`;
    s.iterations.forEach(it=>{
      html+=`<div class="card"><b>第 ${it.round} 轮</b>
        ${it.instruction?` · 要求：${it.instruction}`:''}</div>`;
    });
  }

  if((s.audit||[]).length){
    html+=`<h2>审计记录</h2><div class="card"><table><tr><th>时间</th><th>操作人</th>
      <th>动作</th><th>说明</th></tr>`+
      s.audit.map(a=>`<tr><td>${a.created_at}</td><td>${a.actor}</td>
        <td>${a.action}</td><td>${(a.comment||'').slice(0,80)}</td></tr>`).join('')+
      `</table></div>`;
  }

  el.innerHTML=html;
  document.querySelectorAll('#plist .run-item').forEach(d=>d.classList.remove('active'));
}

async function decideProposal(){
  const pick=document.querySelector('input[name=pick]:checked');
  if(!pick){ toast('请先选择一个方案'); return; }
  try{
    const r=await api(`/proposal/${pcurrent}/decide`,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({selected:pick.value,
        comment:document.getElementById('pdecComment').value, actor:'web'})});
    toast(`已拍板: ${P_LABEL[r.selected]} 编写定稿`);
    loadProposals(); showProposal(pcurrent);
  }catch(e){ toast('失败: '+e.message); }
}

async function iterateProposal(){
  const btn=event.target; btn.disabled=true;
  document.getElementById('piterHint').style.display='block';
  try{
    const r=await api(`/proposal/${pcurrent}/iterate`,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({instruction:document.getElementById('piterInstruction').value,
        actor:'web'})});
    toast(`第 ${r.round} 轮完成，请再次拍板`);
    loadProposals(); showProposal(pcurrent);
  }catch(e){ toast('失败: '+e.message); }
  btn.disabled=false;
  document.getElementById('piterHint').style.display='none';
}
</script>
</body>
</html>
